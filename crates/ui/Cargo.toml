[package]
name = "yokoso-ui"
description = "The toolkit yokoso draws itself with"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["dynamic", "libloading"] }
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
rustix = { version = "1.1.2", features = ["time"] }
smithay-client-toolkit = "0.21.1"
tracing = "0.1.44"
parley = "0.13.0"
# fontconfig is opened at run time: nothing of it is needed to build.
fontique = { version = "0.13.0", default-features = false, features = ["fontconfig-dlopen"] }
swash = "0.2.10"
material-colors = { version = "0.5.0", default-features = false, features = ["std"] }
resvg = { version = "0.50.0", default-features = false }
unicode-segmentation = "1.12.0"
