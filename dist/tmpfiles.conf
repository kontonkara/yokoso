# yokoso's own directories, for greetd's greeter account: the last login's
# user and session, and Mesa's and Qt's shader caches. "greeter" is Arch's;
# where greetd's config.toml runs the greeter as another, copy this to
# /etc/tmpfiles.d/yokoso.conf with that one.
d /var/lib/yokoso 0700 greeter greeter -
d /var/cache/yokoso 0700 greeter greeter -
